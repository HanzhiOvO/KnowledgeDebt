name: 功能建议
description: 提议改进产品、架构或开发体验
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请先描述用户问题，而不是只描述一种实现。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为、边界与可能的替代方案。
    validations:
      required: true
  - type: checkboxes
    id: invariants
    attributes:
      label: 产品不变量
      options:
        - label: Session 独立于录音存在
          required: true
        - label: 阅读内容不会直接清债
          required: true
        - label: 外部发送必须保持明确授权
          required: true
