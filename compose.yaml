name: knowledgedebt

services:
  # 生产数据使用 PostgreSQL；本地非容器开发仍默认使用 SQLite。
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledgedebt
      POSTGRES_USER: knowledgedebt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgedebt -d knowledgedebt"]
      interval: 5s
      timeout: 5s
      retries: 10
    cpus: 0.5
    mem_limit: 512m

  # FastAPI 负责领域逻辑、证据校验、Provider 编排与资源存储。
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      KNOWLEDGEDEBT_DATABASE_URL: postgresql://knowledgedebt:${POSTGRES_PASSWORD:-change-this-password}@database:5432/knowledgedebt
      KNOWLEDGEDEBT_DATA_DIR: /data
      KNOWLEDGEDEBT_ACCESS_TOKEN: ${KNOWLEDGEDEBT_ACCESS_TOKEN:-}
      KNOWLEDGEDEBT_AI_PROVIDER: ${KNOWLEDGEDEBT_AI_PROVIDER:-openai_compatible}
      KNOWLEDGEDEBT_ASR_PROVIDER: ${KNOWLEDGEDEBT_ASR_PROVIDER:-openai_compatible}
      KNOWLEDGEDEBT_EMBEDDING_PROVIDER: ${KNOWLEDGEDEBT_EMBEDDING_PROVIDER:-hash}
      KNOWLEDGEDEBT_AI_MODEL: ${KNOWLEDGEDEBT_AI_MODEL:-gpt-5-mini}
      KNOWLEDGEDEBT_ASR_MODEL: ${KNOWLEDGEDEBT_ASR_MODEL:-gpt-4o-mini-transcribe}
      KNOWLEDGEDEBT_EMBEDDING_MODEL: ${KNOWLEDGEDEBT_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      KNOWLEDGEDEBT_STORAGE_PROVIDER: ${KNOWLEDGEDEBT_STORAGE_PROVIDER:-local}
      KNOWLEDGEDEBT_S3_BUCKET: ${KNOWLEDGEDEBT_S3_BUCKET:-}
      KNOWLEDGEDEBT_S3_ENDPOINT_URL: ${KNOWLEDGEDEBT_S3_ENDPOINT_URL:-}
      # 本地 ASR：留空即不启用；私网服务地址示例 http://asr:8080/v1
      KNOWLEDGEDEBT_LOCAL_ASR_BINARY: ${KNOWLEDGEDEBT_LOCAL_ASR_BINARY:-whisper-cli}
      KNOWLEDGEDEBT_LOCAL_ASR_MODEL: ${KNOWLEDGEDEBT_LOCAL_ASR_MODEL:-}
      KNOWLEDGEDEBT_LOCAL_ASR_MODEL_DIR: ${KNOWLEDGEDEBT_LOCAL_ASR_MODEL_DIR:-}
      KNOWLEDGEDEBT_LOCAL_ASR_LANGUAGE: ${KNOWLEDGEDEBT_LOCAL_ASR_LANGUAGE:-zh}
      KNOWLEDGEDEBT_LOCAL_ASR_THREADS: ${KNOWLEDGEDEBT_LOCAL_ASR_THREADS:-0}
      KNOWLEDGEDEBT_LOCAL_ASR_TIMEOUT_SECONDS: ${KNOWLEDGEDEBT_LOCAL_ASR_TIMEOUT_SECONDS:-3600}
      KNOWLEDGEDEBT_LOCAL_ASR_SERVICE_URL: ${KNOWLEDGEDEBT_LOCAL_ASR_SERVICE_URL:-}
      KNOWLEDGEDEBT_LOCAL_ASR_SERVICE_MODEL: ${KNOWLEDGEDEBT_LOCAL_ASR_SERVICE_MODEL:-}
      # whisper.cpp 自带 server 用 /inference；OpenAI 兼容服务保持默认。
      KNOWLEDGEDEBT_LOCAL_ASR_SERVICE_PATH: ${KNOWLEDGEDEBT_LOCAL_ASR_SERVICE_PATH:-/audio/transcriptions}
      KNOWLEDGEDEBT_LOCAL_ASR_SERVICE_CONVERT_WAV: ${KNOWLEDGEDEBT_LOCAL_ASR_SERVICE_CONVERT_WAV:-false}
    volumes:
      - resource_data:/data
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8123:8123"
    cpus: 1.0
    mem_limit: 1g

  # Next.js 是主要客户端，并通过服务端同源代理访问 backend。
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      KNOWLEDGEDEBT_API_URL: http://backend:8123
      KNOWLEDGEDEBT_ACCESS_TOKEN: ${KNOWLEDGEDEBT_ACCESS_TOKEN:-}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    cpus: 0.5
    mem_limit: 512m

  # 可选的本地转写工作进程；默认不启动，需显式 `docker compose --profile local-asr up`。
  # 未在交接环境验证（交接机器没有 Docker），验证清单见 deploy/local-asr/README.md。
  asr:
    profiles: ["local-asr"]
    build:
      context: deploy/local-asr
    restart: unless-stopped
    environment:
      WHISPER_MODEL: /models/${KNOWLEDGEDEBT_LOCAL_ASR_MODEL_FILE:-ggml-medium.bin}
      WHISPER_LANGUAGE: ${KNOWLEDGEDEBT_LOCAL_ASR_LANGUAGE:-zh}
      WHISPER_THREADS: ${KNOWLEDGEDEBT_LOCAL_ASR_THREADS:-4}
    volumes:
      - asr_models:/models
    expose:
      - "8080"
    # 转写是 CPU 密集任务：先限制单并发，避免和 API/Web 抢占资源。
    cpus: ${KNOWLEDGEDEBT_LOCAL_ASR_CPUS:-4.0}
    mem_limit: ${KNOWLEDGEDEBT_LOCAL_ASR_MEMORY:-6g}

volumes:
  postgres_data:
  resource_data:
  asr_models:
